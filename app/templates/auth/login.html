<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GreenLeaf Grocers</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        .login-card {
            max-width: 440px;
            width: 100%;
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .btn-green {
            background-color: #2e7d32;
            color: #ffffff;
            font-weight: 600;
        }
        .btn-green:hover {
            background-color: #1b5e20;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="card login-card p-4 p-md-5 mx-auto bg-white">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle mb-3" style="width: 64px; height: 64px;">
                    <i class="bi bi-shield-lock-fill fs-2"></i>
                </div>
                <h3 class="fw-bold mb-1 text-dark">GreenLeaf Grocers</h3>
                <p class="text-muted small">Employee Portal &bull; Sign in to continue</p>
            </div>

            <!-- Flash Alert Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show small" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold small text-secondary">USERNAME</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="e.g. admin or cashier1" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold small text-secondary">PASSWORD</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-key text-muted"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-green w-100 py-2 d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-box-arrow-in-right"></i> Sign In
                </button>
            </form>

            <div class="mt-4 p-3 bg-light rounded-3 border">
                <div class="d-flex align-items-center gap-1 mb-2 text-muted fw-semibold small">
                    <i class="bi bi-info-circle"></i> Demo Credentials
                </div>
                <div class="row g-2 small text-center">
                    <div class="col-6">
                        <div class="p-2 border rounded bg-white">
                            <span class="badge bg-primary mb-1">Admin</span>
                            <div class="text-dark fw-bold">admin</div>
                            <div class="text-muted font-monospace">admin123</div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="p-2 border rounded bg-white">
                            <span class="badge bg-secondary mb-1">Cashier</span>
                            <div class="text-dark fw-bold">cashier1</div>
                            <div class="text-muted font-monospace">cashier123</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
