{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-warning">500</div>
    <h3 class="fw-bold mt-2">Internal Server Error</h3>
    <p class="text-muted">Something unexpected occurred. Our systems have logged this incident.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-success mt-2">
        <i class="bi bi-house-door"></i> Return to Safety
    </a>
</div>
{% endblock %}
