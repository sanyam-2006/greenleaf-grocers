{% extends "base.html" %}

{% block title %}403 - Access Forbidden{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-danger">403</div>
    <h3 class="fw-bold mt-2">Access Forbidden</h3>
    <p class="text-muted">You do not have permission to view this administrative resource. Admin privileges required.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary mt-2">
        <i class="bi bi-arrow-left"></i> Go Back
    </a>
</div>
{% endblock %}
