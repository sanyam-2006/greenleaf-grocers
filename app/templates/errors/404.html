{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-success">404</div>
    <h3 class="fw-bold mt-2">Oops! Page Not Found</h3>
    <p class="text-muted">The page or resource you are looking for does not exist or has been moved.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-success mt-2">
        <i class="bi bi-house-door"></i> Return to Home
    </a>
</div>
{% endblock %}
